name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv run --extra dev pytest
      - run: uv run --extra dev ruff check src tests .github/actions
      - run: uv run --extra dev ruff format --check src tests .github/actions
      - run: uv run python -m compileall -q src tests .github/actions
