[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-document-manager"
version = "0.8.1"
description = "Agent-oriented encrypted personal document maintenance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Viktor Shcherbakov" },
]
dependencies = []

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.0",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
pdocs = "pdocs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
