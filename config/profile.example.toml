version = 1

[deployment]
# Replace with a fresh lowercase UUID for every PDM deployment.
id = "REPLACE-WITH-UUID"

[paths]
vault = "~/Documents/Personal Documents Vault"
inbox = "~/Documents/Personal Documents Inbox"
state = "~/.local/state/pdocs"

[views]
refresh_interval_seconds = 300

[views.local]
path = "~/Documents/Personal Documents"
prune = true

[views.icloud]
path = "~/Library/Mobile Documents/com~apple~CloudDocs/Personal Documents"
prune = true

[security]
cipher = "gpg-symmetric"
gpg_binary = "gpg"

[gmail]
enabled = true
account = "you@example.com"
oauth_client = "~/.config/pdocs/google-gmail-oauth-client.json"
scan_queries = [
  "newer_than:30d -category:promotions -category:social",
]

[sources.gmail.personal-documents]
query = "-category:promotions -category:social"
initial_window = "30d"
overlap_window = "24h"

[sources.folder.iphone]
# A normal local folder or a locally synchronized cloud folder.
root = "~/Documents/PDM Exchange"
inbox = "Inbox"
extensions = ["pdf", "jpg", "jpeg", "png", "heic"]

[backup]
enabled = true
provider = "google-drive"
account = "you@example.com"
oauth_client = "~/.config/pdocs/google-drive-oauth-client.json"
folder_name = "Personal Document Backups"

[workflow]
commit_after_import = true
push_after_commit = true
require_approval_for = ["delete-record", "change-owner"]

[taxonomy]
domains = [
  "identity-residence",
  "education",
  "employment",
  "household",
  "finance-insurance",
  "legal-cases",
]
